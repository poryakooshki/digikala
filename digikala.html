<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digikala</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" href="./images/digi-icon.webp">

</head>

<body>
    <header>
        <div class=" header">
            <div class="header-baner">
                <img src="./images/baner.digikala.webp" alt="">
            </div>
            <div class="header-center">
                <div class="header-center-right">
                    <div class="header-center-icon">
                        <img src="./svg/difikala-search.svg" alt="">
                    </div>
                    <div class="header-center-search">
                        <input type="text" name="search" value="جستجو">
                    </div>
                </div>
                <div class="header-center-left">
                    <div class="header-center-left-bell">
                        <img src="./svg/bell-svgrepo-com.svg" alt="">
                    </div>
                    <div class="header-center-left-door">
                        <img src="./svg/door-enter-svgrepo-com.svg" alt="">
                        <a href="">
                            <p>ورود</p>
                            <Div class="line-door"></Div>
                            <p>ثبت نام</p>
                        </a>
                    </div>
                    <div class="line-basket"></div>
                    <div class="header-center-left-basket">
                        <img src="./svg/basket-alt-3-svgrepo-com.svg" alt="">
                    </div>
                </div>
            </div>
            <div class="menu">
                <Div class="menu-right">
                    <div class="menu-right-main">
                        <img src="./svg/hamburger-svgrepo-com.svg" alt="">
                        <a href="">دسته بندس کالا ها</a>
                    </div>
                    <div class="line-menu"></div>
                    <div class="menu-hover">
                        <img src="./svg/off.svg" alt="">
                        <a href="">شگفت انگیز ها</a>
                    </div>
                    <div class="menu-hover">
                        <img src="./svg/basket-2.svg" alt="">
                        <a href="">سوپر مارکت</a>
                    </div>
                    <div class="menu-hover">
                        <img src="./svg/gold.svg" alt="">
                        <a href="">طلا و نقره دیجیتال</a>
                    </div>
                    <div class="menu-hover">
                        <img src="./svg/fire.svg" alt="">
                        <a href="">پر فروش ترین ها</a>
                    </div>
                    <div class="menu-hover">
                        <img src="./svg/lebas.svg" alt="">
                        <a href="">دیجی استایل</a>
                    </div>
                    <div class="line-menu">
                    </div>
                    <div class="menu-hover">
                        <a href="./digikala.com">!در دیجی کالا بفروشید</a>
                    </div>
                    <div class="menu-left">
                        <img src="./svg/location-pin-alt-1-svgrepo-com.svg" alt="">
                        <a href="">انتخاب ادرس</a>
                    </div>
                </Div>
            </div>
        </div>
    </header>
    <swiper-container class="mySwiper" pagination="true" pagination-clickable="true" navigation="true"
        space-between="30" loop="true">
        <swiper-slide><img src="./images/slider-1.webp" alt=""></swiper-slide>
        <swiper-slide><img src="./images/slider--2.webp" alt=""></swiper-slide>
        <swiper-slide><img src="./images/slider-3.webp" alt=""></swiper-slide>
        <swiper-slide><img src="./images/slider-4.webp" alt=""></swiper-slide>
        <swiper-slide><img src="./images/slider-5.webp" alt=""></swiper-slide>
    </swiper-container>

    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-element-bundle.min.js"></script>
</body>

</html>
